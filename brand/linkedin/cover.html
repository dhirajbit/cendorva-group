<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#192D42}
  .cover{position:relative;width:1128px;height:191px;background:#192D42;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  .grid{position:absolute;inset:0;opacity:.9}
  .text{position:absolute;left:300px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:22px;color:#fff}
  .mono{width:46px;height:46px}
  .word{display:flex;flex-direction:column;line-height:1}
  .name{font-family:Manrope,Inter,sans-serif;font-weight:700;font-size:30px;letter-spacing:.18em}
  .group{margin-top:7px;font-size:12.5px;font-weight:500;letter-spacing:.34em;color:rgba(255,255,255,.7)}
  .rule{width:1px;height:46px;background:rgba(255,255,255,.25);margin:0 8px}
  .tag{font-family:Manrope,Inter,sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;color:rgba(255,255,255,.82)}
  .art{position:absolute;right:-40px;top:-170px;width:560px;height:520px}
</style></head>
<body>
<div class="cover">
  <svg class="grid" viewBox="0 0 1128 191" preserveAspectRatio="none">
    <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#4D758E" stroke-opacity="0.14" stroke-width="1" fill="none"/>
    </pattern></defs>
    <rect width="1128" height="191" fill="url(#g)"/>
  </svg>
  <svg class="art" id="art" viewBox="0 0 600 560" fill="none"></svg>
  <div class="text">
    <svg class="mono" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M27 6.5H6.5v19H27" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="miter"/>
      <rect x="19" y="13" width="6" height="6" fill="#4D758E"/>
    </svg>
    <div class="word"><div class="name">CENDORVA</div><div class="group">GROUP</div></div>
    <div class="rule"></div>
    <div class="tag">Technology. Strategy. Execution.</div>
  </div>
</div>
<script>
  // Same isometric floor-plate drawing as the website hero.
  const iso=(x,y,z)=>[300+(x-y)*0.866, 300+(x+y)*0.5-z];
  const pt=(p)=>p.map(n=>n.toFixed(1)).join(",");
  const plate=(z,s)=>[iso(-s,-s,z),iso(s,-s,z),iso(s,s,z),iso(-s,s,z)].map(pt).join(" ");
  const levels=[{z:0,s:150},{z:90,s:120},{z:180,s:90},{z:270,s:60}];
  const svg=document.getElementById("art"); let out="";
  out+=`<polygon points="${plate(-14,150)}" stroke="#4D758E" stroke-opacity=".25" stroke-width="1"/>`;
  for(let i=0;i<levels.length-1;i++){const l=levels[i],n=levels[i+1];
    for(const [cx,cy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const a=iso(cx*n.s,cy*n.s,l.z),b=iso(cx*n.s,cy*n.s,n.z);
      out+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#8FB0C4" stroke-opacity=".55" stroke-width="1"/>`;}}
  levels.forEach((l,i)=>{const top=i===levels.length-1;
    out+=`<polygon points="${plate(l.z,l.s)}" stroke="${top?"#FFFFFF":"#8FB0C4"}" stroke-opacity="${top?.9:.6}" stroke-width="${top?1.5:1}" fill="${top?"#4D758E":"none"}" fill-opacity="${top?.18:0}"/>`;});
  out+=`<polyline points="${pt(iso(-150,0,0))} ${pt(iso(150,0,0))}" stroke="#4D758E" stroke-opacity=".45" stroke-width="1"/>`;
  out+=`<polyline points="${pt(iso(0,-150,0))} ${pt(iso(0,150,0))}" stroke="#4D758E" stroke-opacity=".45" stroke-width="1"/>`;
  const c=iso(0,0,270); out+=`<rect x="${c[0]-5}" y="${c[1]-5}" width="10" height="10" fill="#4D758E"/>`;
  svg.innerHTML=out;
</script>
</body></html>
