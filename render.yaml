services:
  - type: web
    name: cendorva-group
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CONTACT_ENDPOINT
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /404.html
